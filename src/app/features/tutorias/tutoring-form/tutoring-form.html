<div class="page-header">
  <h1>{{ isEdit ? 'Editar' : 'Nuevo' }} anuncio de tutoría</h1>
</div>

<mat-card>
  <mat-card-content>
    <form #form="ngForm" (submit)="save()">
      @if (error) {
        <mat-error class="error-msg">{{ error }}</mat-error>
      }
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Materia</mat-label>
        <mat-select [(ngModel)]="model.subject" name="subject" required>
          @for (sub of subjects; track sub.id) {
            <mat-option [value]="sub.id">{{ sub.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput [(ngModel)]="model.description" name="description" required rows="3"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Precio por hora ($)</mat-label>
        <input matInput type="number" [(ngModel)]="model.price_per_hour" name="price_per_hour" required min="0" step="0.01">
        <mat-icon matIconPrefix>attach_money</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha disponible</mat-label>
        <input matInput type="datetime-local" [(ngModel)]="model.available_date" name="available_date" required>
        <mat-icon matIconPrefix>calendar_today</mat-icon>
      </mat-form-field>

      <div class="actions">
        <button mat-button routerLink="/my-tutorias">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
