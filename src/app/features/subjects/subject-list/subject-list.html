<div class="page-header">
  <h1>Materias</h1>
  @if (auth.isAdmin() || auth.isTutor()) {
    <button mat-raised-button color="primary" routerLink="/subjects/new">
      <mat-icon>add</mat-icon>
      Nueva materia
    </button>
  }
</div>

<mat-card>
  <div class="table-container">
    @if (Subjects$ | async; as users) {
      <table mat-table [dataSource]="(Subjects$ | async) ?? []">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let s">{{ s.name }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let s">
            <button mat-icon-button color="primary" [routerLink]="['/subjects', s.id, 'edit']">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteSubject(s.id!)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    } @else {
      <p>Cargando usuarios...</p>
    }
  </div>

  @if ((Subjects$ | async)?.length === 0) {
    <div class="empty">No hay materias registradas.</div>
  }
</mat-card>
