<div class="login-container">
  <a routerLink="/" class="back-home" aria-label="Volver al inicio">
    <mat-icon>arrow_back</mat-icon>
    Volver al inicio
  </a>
  <mat-card class="login-card">
    <mat-card-content>
      <div class="brand-logo">
        <mat-icon>school</mat-icon>
        <h2>Micro-tutorías</h2>
        <p>Inicia sesión en tu cuenta</p>
      </div>
      @if (error) {
        <mat-error class="error-msg">{{ error }}</mat-error>
      }
      <form #loginForm="ngForm" (submit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput [(ngModel)]="username" name="username" required>
          <mat-icon matIconPrefix>person</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hide() ? 'password' : 'text'" [(ngModel)]="password" name="password" required>
          <button mat-icon-button matIconSuffix (click)="hide.set(!hide())" type="button">
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="!loginForm.valid">
          Ingresar
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/register">Crear cuenta</a>
    </mat-card-actions>
  </mat-card>
</div>
